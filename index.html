<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#191b1e" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="学科試験">
  <meta name="description" content="兵庫・明石の運転免許学科試験に向けた○×練習アプリ">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./style.css">
  <title>学科試験トレーニング</title>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="学科試験トレーニング ホーム">
      <span class="app-icon" aria-hidden="true"><span>○</span><span>×</span></span>
      <span class="brand-copy"><b>学科試験</b><small>兵庫・明石 運転免許トレーニング</small></span>
    </a>
    <span class="header-tag">PRACTICE</span>
  </header>

  <main>
    <section class="welcome" aria-labelledby="welcome-title">
      <div>
        <p class="eyebrow">DRIVE STUDY</p>
        <h1 id="welcome-title">合格まで、<span>一問ずつ。</span></h1>
        <p class="lead">試験セットを選んで、○×で答えましょう。</p>
      </div>
      <div class="set-count"><b>9</b><span>試験セット</span></div>
    </section>

    <section class="set-section" aria-labelledby="set-heading">
      <div class="section-heading">
        <div><p class="eyebrow">CHOOSE A TEST</p><h2 id="set-heading">試験セット</h2></div>
        <div class="section-tools"><span class="section-hint">横にスワイプ</span><button id="historyBtn" class="history-button" type="button">実施状況</button></div>
      </div>
      <div id="testList" class="test-list" aria-label="試験セット"></div>
    </section>

    <section class="workspace" aria-labelledby="title">
      <div class="mode-picker" id="modePicker" role="group" aria-label="学習モード">
        <button type="button" class="mode-choice selected" data-mode="exam" aria-pressed="true">試験モード</button>
        <button type="button" class="mode-choice" data-mode="practice" aria-pressed="false">練習モード</button>
      </div>
      <div class="exam-head">
        <div class="exam-title">
          <span id="kind" class="pill"></span>
          <h2 id="title"></h2>
          <p id="details" class="details"></p>
        </div>
        <div class="exam-actions">
          <div class="timer" role="timer" aria-live="off">
            <span>残り時間</span><b id="clock">30:00</b>
          </div>
          <button id="start" class="start" type="button">試験を開始</button>
        </div>
      </div>
      <div class="statusbar">
        <span id="counter" aria-live="polite"></span>
        <span class="answer-hint"><span class="true-dot">○</span> 正しい <span class="false-dot">×</span> 誤り</span>
      </div>
      <div id="questions" class="answer-grid"></div>
    </section>
  </main>

  <footer>学習用ツール ・ 問題文は収録資料をもとに作成</footer>
  <dialog id="result" aria-labelledby="resultTitle">
    <div class="result-inner">
      <span class="pill">SESSION COMPLETE</span>
      <h2 id="resultTitle"></h2>
      <p id="resultText"></p>
      <button id="closeResult" class="start" type="button">閉じる</button>
    </div>
  </dialog>
  <dialog id="history" aria-labelledby="historyTitle">
    <div class="history-inner">
      <div class="history-heading"><div><span class="pill">STUDY HISTORY</span><h2 id="historyTitle">実施状況</h2></div><button id="closeHistory" class="close-history" type="button" aria-label="閉じる">×</button></div>
      <div id="historyContent" class="history-content"></div>
    </div>
  </dialog>

  <script src="./special-data.js"></script>
  <script src="./number-data.js"></script>
  <script src="./answer-explanations.js"></script>
  <script src="./app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
